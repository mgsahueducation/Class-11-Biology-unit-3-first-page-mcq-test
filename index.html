<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET Unit 3 · Interactive Quiz · Cell Structure & Functions</title>
<style>
/* ============ RESET & BASE ============ */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,system-ui,sans-serif; }
body {
    background: linear-gradient(145deg,#e8f0f8 0%,#d4e4f0 100%);
    min-height:100vh; display:flex; justify-content:center; align-items:center; padding:1.5rem;
}
/* ============ WRAPPER ============ */
.quiz-wrapper {
    max-width:880px; width:100%; background:#fff; border-radius:2.5rem;
    box-shadow:0 30px 50px -20px rgba(2,48,71,.4),0 0 0 1px rgba(255,255,255,.6) inset;
    padding:2rem 2.2rem 2.2rem;
}
/* ============ HEADER ============ */
.quiz-header {
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center;
    margin-bottom:1.8rem; border-bottom:2px solid #cde0ea; padding-bottom:1rem; gap:.7rem;
}
.quiz-header h1 {
    font-size:1.7rem; font-weight:700; color:#0b3b5c;
    display:flex; align-items:center; gap:.6rem;
}
.quiz-header h1 span {
    background:#2a8c9b; color:#fff; font-size:.9rem; font-weight:600;
    padding:.25rem 1rem; border-radius:40px;
}
.progress-indicator {
    background:#e2f0f5; border-radius:40px; padding:.35rem 1.3rem;
    font-weight:600; color:#0b5e6e; font-size:.95rem; border:1px solid #b3d6e3;
}
/* ============ QUESTION ============ */
.question-container { min-height:380px; }
.question-text {
    font-size:1.35rem; font-weight:600; color:#0e2e42; margin-bottom:1.5rem;
    line-height:1.45; border-left:7px solid #2a8c9b; padding-left:1.2rem;
}
/* ============ OPTIONS ============ */
.options-grid { display:flex; flex-direction:column; gap:.85rem; margin-bottom:1.5rem; }
.option-btn {
    display:flex; align-items:center; gap:1rem; background:#f6fafe;
    border:1.5px solid #c8dce8; border-radius:60px; padding:.85rem 1.5rem;
    font-size:1.05rem; font-weight:500; color:#123f53; text-align:left;
    cursor:pointer; transition:all .15s ease; width:100%; line-height:1.4;
}
.option-btn:hover:not(:disabled) {
    background:#e2f0f8; border-color:#6faec4; transform:translateY(-1px);
    box-shadow:0 8px 14px -8px rgba(20,100,120,.25);
}
.option-btn:disabled { cursor:default; opacity:.9; }
.option-letter {
    display:flex; align-items:center; justify-content:center; background:#fff;
    border-radius:50%; width:32px; height:32px; font-weight:700; font-size:.95rem;
    color:#0e5a70; border:1.5px solid #aac7d7; flex-shrink:0;
}
.option-btn.correct { background:#d8f5e6; border-color:#229e5e; color:#0a462a; }
.option-btn.correct .option-letter { background:#229e5e; border-color:#229e5e; color:#fff; }
.option-btn.wrong { background:#ffe2e2; border-color:#d45a5a; color:#741e1e; }
.option-btn.wrong .option-letter { background:#d45a5a; border-color:#d45a5a; color:#fff; }
/* ============ EXPLANATION ============ */
.explanation-box {
    margin-top:1.4rem; background:#f0f7fc; border-radius:18px; padding:1.3rem 1.6rem;
    border-left:6px solid #2a8c9b; animation:fadeIn .3s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
.explanation-title {
    display:flex; align-items:center; gap:.6rem; font-weight:700;
    font-size:1.05rem; color:#0b3b5c; margin-bottom:.7rem;
}
.explanation-title::before { content:"💡"; font-size:1.3rem; }
.explanation-text { color:#1d4c61; font-size:.98rem; line-height:1.6; }
.explanation-text strong { color:#0b5e6e; font-weight:700; }
/* ============ NAVIGATION ============ */
.nav-buttons {
    display:flex; justify-content:space-between; align-items:center;
    gap:1rem; margin-top:2rem; flex-wrap:wrap;
}
.nav-btn {
    background:#fff; border:1.8px solid #b4d0df; border-radius:50px;
    padding:.8rem 2rem; font-size:1rem; font-weight:600; color:#1c6a7a;
    cursor:pointer; transition:all .15s ease; min-width:140px;
}
.nav-btn:hover:not(:disabled) {
    background:#d9eaf3; border-color:#2a8c9b; color:#0b3b5c;
    transform:translateY(-2px); box-shadow:0 10px 16px -8px rgba(20,100,120,.3);
}
.nav-btn:disabled { opacity:.4; cursor:not-allowed; }
.nav-btn.reset-btn { border-color:#d0a5a5; color:#9e4a4a; }
.nav-btn.reset-btn:hover:not(:disabled) { background:#fae3e3; border-color:#b14b4b; color:#6b2020; }
.score-badge {
    background:#e2f0f5; border-radius:40px; padding:.5rem 1.5rem;
    font-weight:600; color:#0f5b6b; font-size:1rem; border:1px solid #b3d6e3;
    white-space:nowrap;
}
.score-badge span { color:#0b3b5c; font-weight:800; font-size:1.2rem; margin-left:.3rem; }
/* ============ RESPONSIVE ============ */
@media (max-width:650px) {
    .quiz-wrapper { padding:1.4rem; border-radius:2rem; }
    .quiz-header h1 { font-size:1.3rem; }
    .question-text { font-size:1.1rem; padding-left:.9rem; border-left-width:5px; }
    .option-btn { font-size:.95rem; padding:.7rem 1rem; }
    .nav-btn { padding:.7rem 1.2rem; font-size:.9rem; min-width:110px; }
}
@media (max-width:480px) {
    .quiz-header { flex-direction:column; align-items:flex-start; }
    .nav-buttons { flex-direction:column; align-items:stretch; }
    .nav-btn { width:100%; }
}
</style>
</head>
<body>
<div class="quiz-wrapper">
    <header class="quiz-header">
        <h1>Cell Structure &amp; Functions <span>UNIT 3</span></h1>
        <div class="progress-indicator" id="progressText">Q1 / 12</div>
    </header>

    <main class="question-container" id="questionContainer"></main>

    <footer class="nav-buttons">
        <button class="nav-btn" id="prevBtn" disabled>← Previous</button>
        <div class="score-badge">Score: <span id="scoreValue">0</span> / 12</div>
        <button class="nav-btn" id="nextBtn">Next →</button>
        <button class="nav-btn reset-btn" id="resetBtn">↻ Reset</button>
    </footer>
</div>

<script>
(function(){
'use strict';

/* ============ QUESTION BANK ============ */
const questions = [
    {
        question:"The cell theory emphasised the unity underlying the diversity of life forms. Who first proposed the concept “Omnis cellula-e cellula”?",
        options:["Schleiden and Schwann","Rudolf Virchow","Robert Hooke","Antonie van Leeuwenhoek"],
        correct:1,
        explanation:"Rudolf Virchow (1855) first proposed <strong>“Omnis cellula-e cellula”</strong>, meaning all cells arise from pre-existing cells. This was a crucial addition to the original cell theory."
    },
    {
        question:"Lecithin, a small molecular weight organic compound found in living tissues, is an example of:",
        options:["Carbohydrate","Protein","Lipid","Nucleic acid"],
        correct:2,
        explanation:"Lecithin is a <strong>phospholipid</strong> (a class of lipids). It is a major component of cell membranes, composed of glycerol, fatty acids, phosphate, and choline."
    },
    {
        question:"Spindle fibres attach to kinetochores of chromosomes during which phase of mitosis?",
        options:["Telophase","Anaphase","Metaphase","Prophase"],
        correct:2,
        explanation:"During <strong>metaphase</strong>, spindle fibres attach to the kinetochores of chromosomes. The chromosomes align at the metaphase plate."
    },
    {
        question:"The physico-chemical approach to study living organisms using cell-free systems is called:",
        options:["Reductionist Biology","Systems Biology","Evolutionary Biology","Molecular phylogeny"],
        correct:0,
        explanation:"This is <strong>Reductionist Biology</strong>. It applies physics and chemistry to understand biological processes at the molecular level."
    },
    {
        question:"Which one of the following never occurs during mitotic cell division?",
        options:["Cytokinesis","Crossing over","Separation of sister chromatids","Formation of metaphase plate"],
        correct:1,
        explanation:"<strong>Crossing over</strong> occurs during meiosis (prophase I), not mitosis. Mitosis is an equational division."
    },
    {
        question:"A typical fat molecule is made up of:",
        options:["One glycerol and three fatty acids","One glycerol and two fatty acids","Three glycerol and one fatty acid","Three glycerol and three fatty acids"],
        correct:0,
        explanation:"A fat (triglyceride) molecule consists of <strong>one glycerol and three fatty acids</strong> esterified together."
    },
    {
        question:"Which one of the following structures between two adjacent cells is an effective transport pathway?",
        options:["Plasmodesmata","Tight junctions","Desmosomes","Gap junctions (animal cells only)"],
        correct:0,
        explanation:"<strong>Plasmodesmata</strong> are cytoplasmic channels connecting adjacent plant cells, allowing direct transport and communication."
    },
    {
        question:"In plant cells, cytokinesis occurs by:",
        options:["Cleavage furrow formation","Cell plate formation","Fragmentation","Budding"],
        correct:1,
        explanation:"Plant cells form a <strong>cell plate</strong> during cytokinesis. It grows outward and fuses with the existing cell wall."
    },
    {
        question:"Which of the following is a cofactor that is tightly bound to the apoenzyme?",
        options:["Prosthetic group","Coenzyme","Metal ion (loosely bound)","Substrate"],
        correct:0,
        explanation:"A <strong>prosthetic group</strong> is tightly (often covalently) bound to the apoenzyme. Coenzymes are loosely bound."
    },
    {
        question:"During which phase of mitosis do sister chromatids separate and move to opposite poles?",
        options:["Metaphase","Anaphase","Telophase","Prophase"],
        correct:1,
        explanation:"In <strong>anaphase</strong>, sister chromatids separate at the centromere and are pulled to opposite poles by spindle fibres."
    },
    {
        question:"Which of the following is NOT a characteristic of prokaryotic cells?",
        options:["Presence of a well-defined nucleus","70S ribosomes","Single circular DNA","Mesosomes"],
        correct:0,
        explanation:"Prokaryotic cells <strong>lack a well-defined nucleus</strong>. Their DNA lies in the nucleoid region, not enclosed by a nuclear membrane."
    },
    {
        question:"The zwitterionic form of an amino acid is most prevalent at:",
        options:["Acidic pH","Basic pH","Isoelectric point","Neutral pH only"],
        correct:2,
        explanation:"At the <strong>isoelectric point (pI)</strong>, the amino acid carries no net charge and exists predominantly as a zwitterion."
    }
];

/* ============ STATE ============ */
let currentIndex = 0;
let userAnswers = new Array(questions.length).fill(null);
let score = 0;

/* ============ DOM ============ */
const questionContainer = document.getElementById('questionContainer');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const progressText = document.getElementById('progressText');
const scoreValue = document.getElementById('scoreValue');

/* ============ RENDER ============ */
function renderQuestion(){
    const q = questions[currentIndex];
    const selectedIndex = userAnswers[currentIndex];
    const isAnswered = selectedIndex !== null;

    let optionsHtml = '';
    for(let i=0;i<q.options.length;i++){
        let cls = 'option-btn';
        if(isAnswered){
            if(i === q.correct) cls += ' correct';
            else if(i === selectedIndex) cls += ' wrong';
        }
        const dis = isAnswered ? 'disabled' : '';
        optionsHtml += `<button class="${cls}" data-option-index="${i}" ${dis}>
            <span class="option-letter">${String.fromCharCode(65+i)}</span>
            ${q.options[i]}
        </button>`;
    }

    let explanationHtml = '';
    if(isAnswered){
        const ok = selectedIndex === q.correct;
        const letter = String.fromCharCode(65 + q.correct);
        const status = ok ? 'Correct!' : `Incorrect. The correct answer is <strong>${letter}</strong>.`;
        explanationHtml = `<div class="explanation-box">
            <div class="explanation-title">Explanation ${ok?'✅':'❌'}</div>
            <div class="explanation-text">${status}<br><br>${q.explanation}</div>
        </div>`;
    }

    questionContainer.innerHTML = `
        <div class="question-text">${q.question}</div>
        <div class="options-grid">${optionsHtml}</div>
        ${explanationHtml}
    `;

    if(!isAnswered){
        document.querySelectorAll('.option-btn').forEach(btn=>{
            btn.addEventListener('click',()=>{
                handleOptionSelect(parseInt(btn.dataset.optionIndex,10));
            });
        });
    }

    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === questions.length - 1;
    progressText.textContent = `Q${currentIndex+1} / ${questions.length}`;
}

/* ============ SELECT ============ */
function handleOptionSelect(idx){
    if(userAnswers[currentIndex] !== null) return;
    const q = questions[currentIndex];
    userAnswers[currentIndex] = idx;
    if(idx === q.correct){
        score++;
        scoreValue.textContent = score;
    }
    renderQuestion();
}

/* ============ NAVIGATION ============ */
function goPrev(){ if(currentIndex>0){ currentIndex--; renderQuestion(); } }
function goNext(){ if(currentIndex<questions.length-1){ currentIndex++; renderQuestion(); } }

function resetQuiz(){
    currentIndex = 0;
    userAnswers = new Array(questions.length).fill(null);
    score = 0;
    scoreValue.textContent = '0';
    renderQuestion();
}

/* ============ EVENTS ============ */
prevBtn.addEventListener('click',goPrev);
nextBtn.addEventListener('click',goNext);
resetBtn.addEventListener('click',resetQuiz);

/* ============ INIT ============ */
renderQuestion();
})();
</script>
</body>
    </html>
